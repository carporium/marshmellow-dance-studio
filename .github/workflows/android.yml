name: Android debug APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Build debug APK
        run: mkdir -p build && godot --headless --path . --export-debug "Android" build/marshmellow-dance-studio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marshmellow-dance-studio-debug-apk
          path: build/marshmellow-dance-studio-debug.apk
          if-no-files-found: error
