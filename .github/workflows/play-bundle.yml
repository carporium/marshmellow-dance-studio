name: Play Internal Testing bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Install Android source template
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          curl -fsSL -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -p /tmp/godot-templates.tpz templates/android_source.zip \
            > "$HOME/.local/share/godot/export_templates/4.2.2.stable/android_source.zip"
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/4.2.2.stable/android_source.zip" \
            -d android/build

      - name: Configure Play bundle preset
        run: |
          sed -i \
            -e 's#export_path="[^"]*"#export_path="build/marshmellow-dance-studio-release.aab"#' \
            -e 's#gradle_build/use_gradle_build=false#gradle_build/use_gradle_build=true#' \
            -e 's#gradle_build/export_format=0#gradle_build/export_format=1#' \
            -e 's#package/unique_name="[^"]*"#package/unique_name="com.carporium.marshmellowdancestudio"#' \
            -e 's#version/code=[0-9]*#version/code=3#' \
            -e 's#version/name="[^"]*"#version/name="0.2.0"#' \
            export_presets.cfg

      - name: Create upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          test -n "$PLAY_UPLOAD_KEY_ALIAS"
          test -n "$PLAY_UPLOAD_KEY_PASSWORD"
          test -n "$PLAY_UPLOAD_STORE_PASSWORD"
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$PLAY_UPLOAD_KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PLAY_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Play bundle
        run: |
          godot --headless --editor --path . --quit
          mkdir -p build
          godot --headless --path . --export-release "Android" \
            build/marshmellow-dance-studio-release.aab

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: marshmellow-dance-studio-release-aab
          path: build/marshmellow-dance-studio-release.aab
          if-no-files-found: error
